# Development-only tools for muximate. They are installed and executed by mise,
# not by Homebrew or another system package manager.

[min_version]
hard = "2026.8.3"

[settings]
lockfile = true
locked = true

[tools]
actionlint = { version = "1.7.12", backend = "aqua:rhysd/actionlint" }
bats = { version = "1.14.0", backend = "aqua:bats-core/bats-core" }
gitleaks = { version = "8.30.1", backend = "aqua:gitleaks/gitleaks" }
"npm:@commitlint/cli" = "21.2.1"
"npm:@commitlint/config-conventional" = "21.2.0"
"npm:markdownlint-cli" = "0.49.1"
pre-commit = { version = "4.6.0", backend = "aqua:pre-commit/pre-commit" }
shellcheck = { version = "0.11.0", backend = "aqua:koalaman/shellcheck" }
taplo = { version = "0.10.0", backend = "aqua:johnnymorganz/taplo" }
zizmor = { version = "1.29.0", backend = "aqua:zizmorcore/zizmor" }
