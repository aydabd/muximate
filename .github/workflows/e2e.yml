name: End-to-end

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    defaults:
      run:
        shell: bash
    env:
      CMUX_BIN: /nonexistent
      MUXIMATE_BATS_SHOW_OUTPUT: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Check formatting
        run: ./bin/muximate-format-check

      - name: Check shell scripts
        run: shellcheck -s sh -S error bin/*

      - name: Check syntax
        run: |
          sh -n bin/muximate
          sh -n bin/muximate-posix-advanced
          sh -n bin/muximate-install
          sh -n bin/gh-login

      - name: Run end-to-end tests
        run: bin/muximate-bats tests
