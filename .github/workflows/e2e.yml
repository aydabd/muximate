name: End-to-end

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    defaults:
      run:
        shell: bash
    env:
      CMUX_BIN: /nonexistent
      MUXIMATE_BATS_SHOW_OUTPUT: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Check formatting
        run: ./bin/muximate-format-check

      - name: Check shell scripts
        run: shellcheck -S error bin/*

      - name: Check syntax
        run: |
          for script in bin/*; do sh -n "$script"; done
          bash -n bin/gh

      - name: Run end-to-end tests
        run: bin/muximate-bats tests
