name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Maintain release PR / cut production tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Release Please creates the stable tag and updates release metadata.
      issues: write # Release Please manages release labels.
      pull-requests: write # Release Please creates and updates the release PR.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  production:
    name: Deploy production release
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/prod-build.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      source_tag: ${{ needs.release.outputs.release_tag }}
    permissions:
      contents: write # Uploads production archives and checksums to the release.
      id-token: write # Requests the Sigstore signing certificate.
      attestations: write # Stores signed build provenance.
      artifact-metadata: write # Stores artifact metadata for attestation verification.
