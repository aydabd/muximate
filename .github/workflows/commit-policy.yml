name: Commit Policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commit-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed-off-by:
    name: Signed-off-by trailers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: false

      - name: Install commitlint
        run: mise install --locked npm:@commitlint/cli npm:@commitlint/config-conventional

      - name: Verify pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | mise exec --locked -- commitlint

      - name: Verify every pull request commit is signed off
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "/repos/$REPOSITORY/pulls/$PULL_REQUEST/commits?per_page=100" \
            > commits.json
          jq -e '
            flatten
            | length > 0
            and all(.[];
              (.author.login == "github-actions[bot]")
              or (.commit.message | test("(?m)^Signed-off-by: .+ <[^>]+>\\n?$"))
            )
          ' commits.json >/dev/null
          echo "All pull request commits are signed off or generated by github-actions[bot]."

      - name: Verify every pull request commit is conventional
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "/repos/$REPOSITORY/pulls/$PULL_REQUEST/commits?per_page=100" \
            | jq -r 'flatten[] | @base64' \
            | while IFS= read -r encoded; do
                message=$(printf '%s' "$encoded" | base64 --decode | jq -r '.commit.message')
                printf '%s\n' "$message" | mise exec --locked -- commitlint
              done
          echo "All pull request commits follow the Conventional Commits policy."
