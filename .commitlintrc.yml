# Commitlint configuration aligned with github-bootstrap.
# See: https://www.conventionalcommits.org/
---
extends:
  - "@commitlint/config-conventional"

rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
  subject-empty:
    - 2
    - never
  type-empty:
    - 2
    - never
  header-max-length:
    - 2
    - always
    - 100
