repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: detect-private-key
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: markdownlint
        name: Markdown lint
        entry: markdownlint --config .markdownlint.yaml
        language: system
        types: [markdown]

      - id: commitlint
        name: Commitlint
        entry: commitlint
        language: system
        stages: [commit-msg]

      - id: shellcheck
        name: shellcheck POSIX scripts
        entry: shellcheck
        language: system
        always_run: true
        pass_filenames: false
        args:
          - -S
          - error
          - bin/muximate
          - bin/muximate-operations
          - bin/muximate-install
          - bin/muximate-format-check
          - bin/muximate-bats
          - bin/gh-login
          - bin/gh
      - id: bats
        name: bats shell unit tests
        entry: bin/muximate-bats
        language: system
        always_run: true
        pass_filenames: false
        args: [tests]

      - id: actionlint
        name: GitHub Actions workflow lint
        entry: actionlint
        language: system
        always_run: true
        pass_filenames: false

      - id: taplo
        name: TOML syntax and formatting
        entry: taplo format --check
        language: system
        files: \.toml$

      - id: gitleaks
        name: Gitleaks secret scan
        entry: gitleaks dir --redact --no-banner .
        language: system
        always_run: true
        pass_filenames: false

      - id: zizmor
        name: Zizmor GitHub Actions security audit
        entry: zizmor --pedantic
        language: system
        files: ^(\.github/workflows/.*\.yml|\.github/dependabot\.yml|\.pre-commit-config\.yaml)$
